name: Publier le site

on:
  push:
    branches: [main]
  # Reconstruction chaque nuit (vers 4 h à Paris) pour rafraîchir Bachtrack et Substack
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Construire
        env:
          # Site servi à la racine de double-diese.fr
          BASE_PATH: /
        run: npm run build
      - name: Page 404 qui renvoie vers le site, et page /da-capo servie directement
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/da-capo && cp dist/index.html dist/da-capo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
